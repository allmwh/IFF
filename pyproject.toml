[project]
name = "iff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "allmwh", email = "allmwh0103@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "biopython==1.79",
    "bytecode==0.13.0",
    "comet-ml==3.31.16",
    "cosine-annealing-warmup",
    "gitpython==3.1.31",
    "jellyfish==0.9.0",
    "joblib==1.2.0",
    "jupyter==1.0.0",
    "kaleido==0.2.1",
    "matplotlib==3.6.1",
    "numpy==1.23.4",
    "omadb==2.1.7",
    "openpyxl==3.0.10",
    "pandas==1.5.1",
    "plotly==5.11.0",
    "py-cpuinfo==9.0.0",
    "requests==2.28.1",
    "scikit-learn==1.1.3",
    "scipy==1.9.3",
    "selenium==4.5.0",
    "torch==1.13.0+cpu",
    "tqdm==4.64.1",
    "visualizer",
    "webdriver-manager>=4.0.2",
]

[project.scripts]
iff = "iff:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
visualizer = { git = "https://github.com/luo3300612/Visualizer", rev = "d3358cf" }
cosine-annealing-warmup = { git = "https://github.com/katsura-jp/pytorch-cosine-annealing-with-warmup", rev = "12d03c0" }
